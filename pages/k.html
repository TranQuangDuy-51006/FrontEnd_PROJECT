<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pie Chart Animation</title>
    <style>
      .pie-chart {
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background-color: #f0f0f0;
        position: relative;
        overflow: hidden;
        margin: 20px auto;
      }

      .pie-fill {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        clip-path: circle(50% at 50% 50%);
        background: conic-gradient(#db4965 0% 0%);
      }

      .center-label {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.2rem;
        font-weight: bold;
        text-align: center;
      }

      button {
        display: block;
        margin: 20px auto;
        padding: 10px 20px;
        font-size: 16px;
      }

      @keyframes fillPie {
        0% {
          background: conic-gradient(#db4965 0% 0%);
        }
        100% {
          /* Placeholder, sẽ được set bằng JS */
        }
      }
    </style>
  </head>
  <body>
    <div class="pie-chart">
      <div class="pie-fill" id="pieFill"></div>
      <div class="center-label">Nutrition</div>
    </div>

    <button onclick="updatePieChart(15, 45, 40)">Tải dữ liệu</button>

    <script>
      function updatePieChart(fat, carb, protein) {
        const total = fat + carb + protein || 1;
        const fatPercent = (fat / total) * 100;
        const carbPercent = (carb / total) * 100;
        const proteinPercent = (protein / total) * 100;

        const start = performance.now();
        const duration = 500; // Thời gian hiệu ứng

        const pieFill = document.getElementById("pieFill");

        function animate(time) {
          const elapsed = time - start;
          const progress = Math.min(elapsed / duration, 1); // Giới hạn từ 0 đến 1

          const currentFat = fatPercent * progress;
          const currentCarb = carbPercent * progress;
          const currentProtein = proteinPercent * progress;

          const background = `
          conic-gradient(
            #db4965 0% ${currentFat}%,
            #e8a878 ${currentFat}% ${currentFat + currentCarb}%,
            #17a589 ${currentFat + currentCarb}% ${
            currentFat + currentCarb + currentProtein
          }%
          )
        `;
          pieFill.style.background = background;

          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        }

        requestAnimationFrame(animate);
      }
    </script>
  </body>
</html>
